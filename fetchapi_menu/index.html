<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <title>Eredmények</title>
</head>
<body>

<h1>Eredmények</h1>

<form id="form">
    <input type="hidden" id="id">

    <input type="date" id="datum">
    <input type="text" id="pilotaaz" placeholder="Pilóta ID">
    <input type="text" id="helyezes" placeholder="Helyezés">
    <input type="text" id="hiba" placeholder="Hiba">
    <input type="text" id="csapat" placeholder="Csapat">
    <input type="text" id="tipus" placeholder="Típus">
    <input type="text" id="motor" placeholder="Motor">

    <button type="submit">Mentés</button>
</form>

<br>

<table border="1">
    <thead>
        <tr>
            <th>ID</th>
            <th>Dátum</th>
            <th>Pilóta</th>
            <th>Helyezés</th>
            <th>Hiba</th>
            <th>Csapat</th>
            <th>Típus</th>
            <th>Motor</th>
            <th>Műveletek</th>
        </tr>
    </thead>
    <tbody id="tabla"></tbody>
</table>

<script src="fetchapi.js"></script>

</body>
</html>
