<!DOCTYPE html>
<html lang="hu">
<head>

    <style>
  body {
    margin: 0;
    min-height: 100vh;

    background: 
      linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
      url("assets/bg.jpg") center/cover no-repeat;

    color: white;
  }

</style>
  <meta charset="UTF-8">
  <title>F1 Memory Game</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- React -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #ffffff;
      color: rgb(255, 255, 255);
      text-align: center;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 10px;
    }

    .board {
  display: grid;
  grid-template-columns: repeat(6, 250px);
  gap: 35px;
  justify-content: center;
  margin-top: 20px;


    }

    .card {
      width: 200px;
      height: 200px;
      background: #605f5f;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 210px;
    }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">

const { useState, useEffect } = React;

const images = [
  "assets/ferrari.png",
  "assets/mercedes.png",
  "assets/redbull.png",
  "assets/mclaren.png",
  "assets/alpine.png",
  "assets/aston.png",
  "assets/haas.png",
  "assets/visa.png",
  "assets/cadilac.png",
  "assets/williams.png",
  "assets/audi.png",
  "assets/f1.png",
];

function shuffle(array) {
  return [...array].sort(() => Math.random() - 0.5);
}

function generateCards() {
  const duplicated = [...images, ...images];
  return shuffle(
    duplicated.map((img, index) => ({
      img,
      id: img,
      uniqueId: index
    }))
  );
}

//  Card
function Card({ card, flipped, matched, onClick }) {
  return (
    <div className="card" onClick={onClick}>
      {(flipped || matched) ?
        <img src={card.img} /> :
        <span style={{fontSize:"30px"}}>?</span>
      }
    </div>
  );
}

// Board
function Board({ cards, flipped, matched, handleClick }) {
  return (
    <div className="board">
      {cards.map(card => (
        <Card
          key={card.uniqueId}
          card={card}
          flipped={flipped.includes(card.uniqueId)}
          matched={matched.includes(card.id)}
          onClick={() => handleClick(card)}
        />
      ))}
    </div>
  );
}

//  App
function App() {
  const [cards, setCards] = useState([]);
  const [flipped, setFlipped] = useState([]);
  const [matched, setMatched] = useState([]);

  function newGame() {
    setCards(generateCards());
    setFlipped([]);
    setMatched([]);
  }

  useEffect(() => {
    newGame();
  }, []);

  function handleClick(card) {
    if (flipped.length === 2) return;
    if (flipped.includes(card.uniqueId)) return;
    if (matched.includes(card.id)) return;

    setFlipped([...flipped, card.uniqueId]);
  }

  useEffect(() => {
    if (flipped.length === 2) {
      const [a, b] = flipped;

      const c1 = cards.find(c => c.uniqueId === a);
      const c2 = cards.find(c => c.uniqueId === b);

      if (c1.id === c2.id) {
        setMatched(prev => [...prev, c1.id]);
        setFlipped([]);
      } else {
        setTimeout(() => setFlipped([]), 800);
      }
    }
  }, [flipped]);

  return (
    <div className="container game-container">

      <h1 className="mb-4">F1 Memory Game</h1>

      <button className="btn btn-danger" onClick={newGame}>
        New Game
      </button>

      <Board
        cards={cards}
        flipped={flipped}
        matched={matched}
        handleClick={handleClick}
      />

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>

</body>
</html>
